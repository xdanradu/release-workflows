name: Deploy to Production (P1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determines Release Branch
        id: determine
        run: |
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          echo "Current context: $CURRENT_BRANCH"
          
          if [[ "$CURRENT_BRANCH" == "develop" ]]; then
            echo "On develop. Finding latest release or hotfix branch..."
            git fetch --prune origin "+refs/heads/release/*:refs/remotes/origin/release/*"
            
            # Find latest release branch using version sort
            LATEST_RELEASE=$(git branch -r --list "origin/release/*" | sed 's/ *origin\///' | sort -V | tail -n 1)
            
            if [ -z "$LATEST_RELEASE" ]; then
              echo "Error: No release branches found to deploy."
              exit 1
            fi
            
            echo "Found latest release: $LATEST_RELEASE"
            TARGET_BRANCH="$LATEST_RELEASE"
            
          elif [[ "$CURRENT_BRANCH" == release/* ]]; then
            TARGET_BRANCH="$CURRENT_BRANCH"
            echo "Deploying current release branch: $TARGET_BRANCH"
          else
            echo "Error: Deployment allowed only from 'develop' (deploys latest release) or directly from a 'release/' branch."
            exit 1
          fi
          
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout Target Branch
        env:
          TARGET_BRANCH: ${{ steps.determine.outputs.target_branch }}
        run: |
          echo "Checking out $TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"

      - name: Simulate Deployment
        env:
          TARGET_BRANCH: ${{ steps.determine.outputs.target_branch }}
        run: echo "Deploying $TARGET_BRANCH to p1 (Production)... DONE"

      - name: Sync Tag
        id: sync-tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="${{ steps.determine.outputs.target_branch }}"
          TAG_NAME=${BRANCH_NAME#release/}
          
          # Ensure tag is at HEAD (Deployment Artifact)
          git tag -f "$TAG_NAME" HEAD
          # Use refs/tags/ to avoid ambiguity if a branch has same name
          git push origin "refs/tags/$TAG_NAME" --force
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Fetch and Log Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sync-tag.outputs.tag_name }}
        run: |
          echo "Fetching Release Notes for $TAG_NAME..."
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release view "$TAG_NAME" --json body,url
          else
            echo "Release $TAG_NAME not found. Skipping release notes fetching."
          fi

      - name: Finalize Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sync-tag.outputs.tag_name }}
        run: |
          echo "Finalizing release $TAG_NAME"
          # Set prerelease to false, and make it the latest release
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --prerelease=false --latest
          else
            echo "Release $TAG_NAME not found. Skipping finalization."
          fi
