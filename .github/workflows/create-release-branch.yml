name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (e.g. b2c-commerce-2025-32). Leave empty to auto-generate using the current year and next sequence number.'
        required: false
        type: string

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Branch Name
        id: name
        run: |
          INPUT_NAME="${{ inputs.release_name }}"
          
          if [ -n "$INPUT_NAME" ]; then
             BRANCH_NAME="release/$INPUT_NAME"
          else
             # Auto-generate: Sequence based on Max Release Number for the Year
             YEAR=$(date +'%Y')
             
             # Find existing releases for this year
             # Match: origin/release/b2c-commerce-YYYY-NN...
             # Filter branches
             EXISTING=$(git branch -r | grep "origin/release/b2c-commerce-${YEAR}-" || true)
             
             if [ -z "$EXISTING" ]; then
                # No releases this year, start at 1
                NEXT_NUM=1
             else
                # Extract release numbers. 
                # Regex matches number after 'b2c-commerce-YYYY-'. 
                # Handles '...-39' and '...-39-hotfix-1' correctly by capturing only the first number group after year.
                MAX_NUM=$(echo "$EXISTING" | sed -E "s/.*b2c-commerce-${YEAR}-([0-9]+).*/\1/" | sort -nr | head -n 1)
                
                # Default to 0 if something failed in parse (safety)
                if [ -z "$MAX_NUM" ]; then MAX_NUM=0; fi
                
                NEXT_NUM=$((MAX_NUM + 1))
             fi
             
             BRANCH_NAME="release/b2c-commerce-${YEAR}-${NEXT_NUM}"
          fi
          SOURCE_REF="develop"
          echo "Creating standard release branch: $BRANCH_NAME from $SOURCE_REF"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "source_ref=$SOURCE_REF" >> $GITHUB_OUTPUT

      - name: Create and Push Branch
        run: |
          BRANCH_NAME="${{ steps.name.outputs.branch_name }}"
          SOURCE_REF="${{ steps.name.outputs.source_ref }}"
          
          git checkout -b "$BRANCH_NAME" "$SOURCE_REF"
          git push origin "$BRANCH_NAME"
