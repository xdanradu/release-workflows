name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (e.g. b2c-commerce-2025-32). Leave empty to auto-generate.'
        required: false
        type: string

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Branch Name
        id: name
        run: |
          INPUT_NAME="${{ inputs.release_name }}"
          
          if [ -n "$INPUT_NAME" ]; then
             BRANCH_NAME="release/$INPUT_NAME"
          else
             # Calculate Year and Week
             YEAR=$(date +'%Y')
             WEEK=$(date +'%V')
             BRANCH_NAME="release/b2c-commerce-${YEAR}-${WEEK}"
          fi
          SOURCE_REF="develop"
          echo "Creating standard release branch: $BRANCH_NAME from $SOURCE_REF"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "source_ref=$SOURCE_REF" >> $GITHUB_OUTPUT

      - name: Create and Push Branch
        run: |
          BRANCH_NAME="${{ steps.name.outputs.branch_name }}"
          SOURCE_REF="${{ steps.name.outputs.source_ref }}"
          
          git checkout -b "$BRANCH_NAME" "$SOURCE_REF"
          git push origin "$BRANCH_NAME"
